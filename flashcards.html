<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LingoLift - Flashcards</title>
	<link rel="stylesheet" href="final_project.css">
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<div class="brand"><span class="brand-mark">✦</span>INDIGO</div>
			<p class="eyebrow">Menu</p>
			<nav class="nav" aria-label="Main navigation">
				<a href="index.html"><span class="nav-icon">⌂</span><span>Overview</span></a>
				<a href="lessons.html"><span class="nav-icon">▤</span><span>Lessons</span></a>
				<a class="active" href="flashcards.html"><span class="nav-icon">◇</span><span>Flashcards</span></a>
				<a href="practice.html"><span class="nav-icon">✓</span><span>Practice</span></a>
				<a href="progress.html"><span class="nav-icon">◷</span><span>Progress</span></a>
			</nav>
		</aside>
		<main class="main simple-page">
			<header class="topbar"><div class="greeting"><h1>Flashcards</h1><p>Review words one card at a time.</p></div><div class="avatar">SS</div></header>
			<article class="panel wide-panel">
				<p class="eyebrow">French word</p>
				<div class="flashcard"><h3 id="word">la lumière</h3><p id="translation">the light</p></div>
				<div class="flash-actions"><span id="card-count" class="card-number">Card 01 of 20</span><button data-action="flip">Show answer</button><button data-action="next-card">Next →</button></div>
			</article>
		</main>
	</div>
	<div class="toast" role="status" aria-live="polite"></div>
	<script src="final_project.js"></script>
</body>
</html>
